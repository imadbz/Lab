# XcodeGen spec — run `xcodegen generate` (or ./run.sh) to create IslandTranslator.xcodeproj
name: IslandTranslator
options:
  # Change this to something unique to you before running on a real iPhone.
  bundleIdPrefix: dev.lab
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""   # set your Apple ID team here (or in Xcode) for device builds
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  IslandTranslator:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: IslandTranslatorWidget
        embed: true
      - target: IslandTranslatorBroadcast
        embed: true
    attributes:
      # Lets Xcode's automatic signing turn on App Groups for the app ID.
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    entitlements:
      path: App/IslandTranslator.entitlements
      properties:
        # Shared folder with the screen broadcast extension (Shared/ScreenShare.swift).
        # On a real iPhone with your own team, change this here and in ScreenShare.group.
        com.apple.security.application-groups: [group.dev.lab.islandtranslator]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Island Translator
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # Auto-translate keeps the app running while screen sharing is on (App/AutoTranslate.swift).
        UIBackgroundModes: [audio]
        NSPhotoLibraryUsageDescription: Reads your latest screenshot so it can translate the chat in it.
        CFBundleURLTypes:
          - CFBundleURLName: islandtranslator
            CFBundleURLSchemes: [islandtranslator]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lab.islandtranslator
        # Island buttons are compiled into the widget too, but their perform() runs only in the app.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) ISLAND_APP
    scheme: {}
  IslandTranslatorWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Island Translator
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lab.islandtranslator.widget
        SKIP_INSTALL: YES
  IslandTranslatorBroadcast:
    # Screen broadcast extension: keeps a recent frame of whatever is on screen for "Translate screen".
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
      - path: Shared/ScreenShare.swift
    attributes:
      # Lets Xcode's automatic signing turn on App Groups for the app ID.
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    entitlements:
      path: Broadcast/IslandTranslatorBroadcast.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.lab.islandtranslator]
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Island Translator
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lab.islandtranslator.broadcast
        SKIP_INSTALL: YES
